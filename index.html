      color: #ffffff;

    }
    .header-title p {
      color: #778da9;
      font-size: 0.95rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-print {
      background-color: #e0e1dd;
      color: #0d1b2a;
    }
    .btn-print:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
    }
    .btn-reset {
      background-color: #c92a2a;
      color: #ffffff;
    }
    .btn-reset:hover {
      background-color: #e03131;
      transform: translateY(-2px);
    }

    .week-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: #415a77 #1b263b;
    }
    .week-nav::-webkit-scrollbar {
      height: 6px;
    }
    .week-nav::-webkit-scrollbar-thumb {
      background: #415a77;
      border-radius: 3px;
    }
    .week-btn {
      background-color: #1b263b;
      color: #778da9;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #415a77;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .week-btn:hover {
      background-color: #415a77;
      color: #ffffff;
    }
    .week-btn.active {
      background-color: #3a86ff;
      color: #ffffff;
      border-color: #3a86ff;
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    }

      color: #778da9;

// Current active week state
let currentWeek = 2;

// User picks and game results loaded from LocalStorage
let userPicks = JSON.parse(localStorage.getItem('nfl_picks_kyle_clayton')) || {};
let gameResults = JSON.parse(localStorage.getItem('nfl_results_kyle_clayton')) || {};

// Setup Week Tabs
function initWeekNav() {
  const navContainer = document.getElementById('weekNav');
  navContainer.innerHTML = '';

  for (let w = 2; w <= 18; w++) {
    const btn = document.createElement('button');
    btn.className = `week-btn ${w === currentWeek ? 'active' : ''}`;
    btn.textContent = `Week ${w}`;
    btn.onclick = () => {
      currentWeek = w;
      initWeekNav();
      renderGames();
    };
    navContainer.appendChild(btn);
  }
}

// Render Games Grid for Active Week
function renderGames() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';

  const weekGames = nflSchedule[currentWeek] || [];

  weekGames.forEach(game => {
    const kylePick = userPicks[game.id]?.kyle || '';
    const claytonPick = userPicks[game.id]?.clayton || '';
    const winner = gameResults[game.id] || '';

    // Card Element
    const card = document.createElement('div');
    card.className = 'game-card';

    // Status Badges
    let kyleBadge = '';
    let claytonBadge = '';

    if (winner) {
      if (kylePick) {
        kyleBadge = kylePick === winner 
          ? `<span class="status-badge badge-correct">✓ Win</span>` 
          : `<span class="status-badge badge-incorrect">✗ Loss</span>`;
      }
      if (claytonPick) {
        claytonBadge = claytonPick === winner 
          ? `<span class="status-badge badge-correct">✓ Win</span>` 
          : `<span class="status-badge badge-incorrect">✗ Loss</span>`;
      }
    }

    card.innerHTML = `
      <div class="game-header">
        <span>Week ${currentWeek}</span>
        <span>${game.day}</span>
      </div>

      <div class="team-row">
        <div><span class="team-type">AWAY</span><span class="team-name">${game.away}</span></div>
      </div>

      <div class="team-row">
        <div><span class="team-type">HOME</span><span class="team-name">${game.home}</span></div>
      </div>

      <div class="picks-container">
        <!-- Kyle Pick Box -->
        <div class="pick-box">
          <div class="player-label player-kyle">KYLE ${kyleBadge}</div>
          <div class="pick-selector">
            <button class="pick-btn ${kylePick === game.away ? 'selected-kyle' : ''}" 
              onclick="makePick('${game.id}', 'kyle', '${game.away}')">${game.away}</button>
            <button class="pick-btn ${kylePick === game.home ? 'selected-kyle' : ''}" 
              onclick="makePick('${game.id}', 'kyle', '${game.home}')">${game.home}</button>
          </div>
        </div>

        <!-- Clayton Pick Box -->
        <div class="pick-box">
          <div class="player-label player-clayton">CLAYTON ${claytonBadge}</div>
          <div class="pick-selector">
            <button class="pick-btn ${claytonPick === game.away ? 'selected-clayton' : ''}" 
              onclick="makePick('${game.id}', 'clayton', '${game.away}')">${game.away}</button>
            <button class="pick-btn ${claytonPick === game.home ? 'selected-clayton' : ''}" 
              onclick="makePick('${game.id}', 'clayton', '${game.home}')">${game.home}</button>
          </div>
        </div>
      </div>

      <!-- Actual Result Selector -->
      <div class="result-container">
        <span class="result-label">Game Winner:</span>
        <select class="result-select" onchange="setWinner('${game.id}', this.value)">
          <option value="">-- Pending --</option>
          <option value="${game.away}" ${winner === game.away ? 'selected' : ''}>${game.away}</option>
          <option value="${game.home}" ${winner === game.home ? 'selected' : ''}>${game.home}</option>
        </select>
      </div>
    `;

    grid.appendChild(card);
  });

  updateScoreboard();
}

// Save Pick Selection
function makePick(gameId, player, team) {
  if (!userPicks[gameId]) {
    userPicks[gameId] = {};
  }
  
  // Toggle selection if clicked again
  if (userPicks[gameId][player] === team) {
    userPicks[gameId][player] = '';
  } else {
    userPicks[gameId][player] = team;
  }

  localStorage.setItem('nfl_picks_kyle_clayton', JSON.stringify(userPicks));
  renderGames();
}

// Save Official Winner
function setWinner(gameId, winnerTeam) {
  if (winnerTeam) {
    gameResults[gameId] = winnerTeam;
  } else {
    delete gameResults[gameId];
  }

  localStorage.setItem('nfl_results_kyle_clayton', JSON.stringify(gameResults));
  renderGames();
}

// Calculate and Update Total Stats
function updateScoreboard() {
  let kyleWins = 0, kyleLosses = 0;
  let claytonWins = 0, claytonLosses = 0;

  // Iterate over all weeks & games
  Object.keys(nflSchedule).forEach(week => {
    nflSchedule[week].forEach(game => {
      const winner = gameResults[game.id];
      if (winner) {
        const kPick = userPicks[game.id]?.kyle;
        const cPick = userPicks[game.id]?.clayton;

        if (kPick) {
          if (kPick === winner) kyleWins++;
          else kyleLosses++;
        }

        if (cPick) {
          if (cPick === winner) claytonWins++;
          else claytonLosses++;
        }
      }
    });
  });

  // Calculate percentages
  const kyleTotal = kyleWins + kyleLosses;
  const kylePct = kyleTotal > 0 ? (kyleWins / kyleTotal).toFixed(3) : '.000';

  const claytonTotal = claytonWins + claytonLosses;
  const claytonPct = claytonTotal > 0 ? (claytonWins / claytonTotal).toFixed(3) : '.000';

  // Update DOM
  document.getElementById('kyleWins').textContent = kyleWins;
  document.getElementById('kyleLosses').textContent = kyleLosses;
  document.getElementById('kylePct').textContent = kylePct.replace(/^0/, '');

  document.getElementById('claytonWins').textContent = claytonWins;
  document.getElementById('claytonLosses').textContent = claytonLosses;
  document.getElementById('claytonPct').textContent = claytonPct.replace(/^0/, '');

  // Update Leaderboard Badge
  const leaderBadge = document.getElementById('leaderBadge');
  if (kyleWins > claytonWins) {
    leaderBadge.textContent = `Leader: Kyle (+${kyleWins - claytonWins})`;
    leaderBadge.style.background = 'linear-gradient(45deg, #3a86ff, #00b4d8)';
    leaderBadge.style.color = '#fff';
  } else if (claytonWins > kyleWins) {
    leaderBadge.textContent = `Leader: Clayton (+${claytonWins - kyleWins})`;
    leaderBadge.style.background = 'linear-gradient(45deg, #ff0055, #ff5050)';
    leaderBadge.style.color = '#fff';
  } else {
    leaderBadge.textContent = 'Tied Game';
    leaderBadge.style.background = 'linear-gradient(45deg, #ffb703, #fb8500)';
    leaderBadge.style.color = '#000';
  }
}

// Reset LocalStorage Data
function resetPicks() {
  if (confirm("Are you sure you want to reset all picks and scores?")) {
    localStorage.removeItem('nfl_picks_kyle_clayton');
    localStorage.removeItem('nfl_results_kyle_clayton');
    userPicks = {};
    gameResults = {};
    renderGames();
  }
}

// Initial Load
window.onload = function() {
  initWeekNav();
  renderGames();
};
</script>
